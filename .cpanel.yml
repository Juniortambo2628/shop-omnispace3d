---
# cPanel Git deployment — OmniShop (shop.omnispace3d.com)
# Backend (private): /home2/omnispac/solar-and-storage-core
# Public web root:    /home2/omnispac/public_html/shop
#
# Post-deploy (run manually via SSH):
#   cd ~/solar-and-storage-core && composer install --no-dev --optimize-autoloader
#   php artisan migrate --force
#   chmod -R 775 storage bootstrap/cache
deployment:
  tasks:
    - export APP_DIR=/home2/omnispac/solar-and-storage-core
    - export PUBLIC_DIR=/home2/omnispac/public_html/shop
    - /bin/mkdir -p $APP_DIR $PUBLIC_DIR
    - /usr/bin/rsync -av --delete --exclude='.git/' --exclude='.env' --exclude='.env.*' --exclude='vendor/' --exclude='public/' --exclude='artisan.bat' --exclude='test.php' --exclude='inspect_image.php' --exclude='index.php' ./ $APP_DIR/
    - /usr/bin/rsync -av ./public/ $PUBLIC_DIR/
    - /usr/bin/rsync -av --exclude='images/products/' ./static/ $PUBLIC_DIR/static/
