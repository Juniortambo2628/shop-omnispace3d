name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

# Ensure only one deployment runs at a time
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Run Tests
    uses: ./.github/workflows/test.yml

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, json, bcmath, gd, dom
          coverage: none

      - name: Install dependencies (for composer autoloader)
        run: composer install --prefer-dist --no-progress --no-interaction --no-dev

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          # Write private key using heredoc (preserves multiline keys exactly)
          cat << 'SSHKEY' > ~/.ssh/deploy_key
          ${{ secrets.SSH_PRIVATE_KEY }}
          SSHKEY
          chmod 600 ~/.ssh/deploy_key
          
          # Add host to known_hosts
          ssh-keyscan -p ${{ secrets.SSH_PORT || 22 }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          
          # Verify SSH key format
          echo "Verifying SSH key..."
          head -1 ~/.ssh/deploy_key
          tail -1 ~/.ssh/deploy_key
          ssh-keygen -l -f ~/.ssh/deploy_key 2>&1 || echo "Key validation output shown above"
          
          # Test connection
          echo "Testing SSH connection..."
          ssh -o ConnectTimeout=10 -o StrictHostKeyChecking=no -p ${{ secrets.SSH_PORT || 22 }} -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "echo SSH_OK" || {
            echo ""
            echo "=== SSH Connection Failed ==="
            echo "Host: ${{ secrets.SSH_HOST }}"
            echo "Port: ${{ secrets.SSH_PORT || 22 }}"
            echo "User: ${{ secrets.SSH_USER }}"
            echo ""
            echo "Troubleshooting:"
            echo "1. Verify SSH_PRIVATE_KEY contains the full private key (including BEGIN/END lines)"
            echo "2. Verify the public key is in ~/.ssh/authorized_keys on the server"
            echo "3. Try connecting manually: ssh -p ${{ secrets.SSH_PORT || 22 }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}"
            exit 1
          }

      - name: Prepare deployment archive
        run: |
          # Create a clean archive of backend files (excluding dev/test files)
          tar czf /tmp/backend.tar.gz \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='vendor' \
            --exclude='public' \
            --exclude='artisan.bat' \
            --exclude='test*.php' \
            --exclude='inspect_image.php' \
            --exclude='*.md' \
            --exclude='*.docx' \
            --exclude='*.bat' \
            --exclude='node_modules' \
            --exclude='.github' \
            --exclude='tests' \
            --exclude='phpunit.xml' \
            --exclude='coverage' \
            --exclude='.phpunit.cache' \
            .

          # Create archive of public files
          tar czf /tmp/public.tar.gz \
            -C public .

          # Create archive of static files (excluding user uploads)
          tar czf /tmp/static.tar.gz \
            --exclude='images/products/*' \
            static/

          echo "Archives created:"
          ls -lh /tmp/backend.tar.gz /tmp/public.tar.gz /tmp/static.tar.gz

      - name: Deploy backend files
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          APP_DIR: /home2/omnispac/solar-and-storage-core
        run: |
          echo "Deploying backend to ${APP_DIR}..."
          
          # Upload archive
          scp -P $SSH_PORT -i ~/.ssh/deploy_key /tmp/backend.tar.gz \
            ${SSH_USER}@${SSH_HOST}:/tmp/backend.tar.gz
          
          # Extract on server
          ssh -p $SSH_PORT -i ~/.ssh/deploy_key ${SSH_USER}@${SSH_HOST} << 'DEPLOY_BACKEND'
            set -e
            APP_DIR="/home2/omnispac/solar-and-storage-core"
            
            # Backup .env if it exists
            if [ -f "${APP_DIR}/.env" ]; then
              cp "${APP_DIR}/.env" "${APP_DIR}/.env.backup.$(date +%Y%m%d%H%M%S)"
            fi
            
            # Create directory if it doesn't exist
            mkdir -p "${APP_DIR}"
            
            # Extract new files (preserves .env)
            cd "${APP_DIR}"
            tar xzf /tmp/backend.tar.gz
            
            # Clean up
            rm -f /tmp/backend.tar.gz
            
            echo "Backend files deployed successfully"
          DEPLOY_BACKEND

      - name: Deploy public files
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          PUBLIC_DIR: /home2/omnispac/public_html/shop
        run: |
          echo "Deploying public files to ${PUBLIC_DIR}..."
          
          # Upload archive
          scp -P $SSH_PORT -i ~/.ssh/deploy_key /tmp/public.tar.gz \
            ${SSH_USER}@${SSH_HOST}:/tmp/public.tar.gz
          
          # Extract on server
          ssh -p $SSH_PORT -i ~/.ssh/deploy_key ${SSH_USER}@${SSH_HOST} << 'DEPLOY_PUBLIC'
            set -e
            PUBLIC_DIR="/home2/omnispac/public_html/shop"
            
            mkdir -p "${PUBLIC_DIR}"
            cd "${PUBLIC_DIR}"
            tar xzf /tmp/public.tar.gz
            
            rm -f /tmp/public.tar.gz
            
            echo "Public files deployed successfully"
          DEPLOY_PUBLIC

      - name: Deploy static files
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          PUBLIC_DIR: /home2/omnispac/public_html/shop
        run: |
          echo "Deploying static files to ${PUBLIC_DIR}/static..."
          
          # Upload archive
          scp -P $SSH_PORT -i ~/.ssh/deploy_key /tmp/static.tar.gz \
            ${SSH_USER}@${SSH_HOST}:/tmp/static.tar.gz
          
          # Extract on server (preserves product images)
          ssh -p $SSH_PORT -i ~/.ssh/deploy_key ${SSH_USER}@${SSH_HOST} << 'DEPLOY_STATIC'
            set -e
            PUBLIC_DIR="/home2/omnispac/public_html/shop"
            
            mkdir -p "${PUBLIC_DIR}/static"
            cd "${PUBLIC_DIR}"
            tar xzf /tmp/static.tar.gz --overwrite
            
            rm -f /tmp/static.tar.gz
            
            echo "Static files deployed successfully"
          DEPLOY_STATIC

      - name: Install dependencies on server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
        run: |
          echo "Installing composer dependencies on server..."
          ssh -p $SSH_PORT -i ~/.ssh/deploy_key ${SSH_USER}@${SSH_HOST} << 'INSTALL_DEPS'
            set -e
            cd /home2/omnispac/solar-and-storage-core
            
            # Run composer install
            composer install --no-dev --optimize-autoloader --no-interaction --no-progress
            
            echo "Dependencies installed successfully"
          INSTALL_DEPS

      - name: Run migrations
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
        run: |
          echo "Running database migrations..."
          ssh -p $SSH_PORT -i ~/.ssh/deploy_key ${SSH_USER}@${SSH_HOST} << 'RUN_MIGRATIONS'
            set -e
            cd /home2/omnispac/solar-and-storage-core
            
            php artisan migrate --force
            
            echo "Migrations completed successfully"
          RUN_MIGRATIONS

      - name: Set permissions
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
        run: |
          echo "Setting file permissions..."
          ssh -p $SSH_PORT -i ~/.ssh/deploy_key ${SSH_USER}@${SSH_HOST} << 'SET_PERMS'
            set -e
            cd /home2/omnispac/solar-and-storage-core
            
            # Set directory permissions
            chmod -R 775 storage bootstrap/cache 2>/dev/null || true
            
            # Ensure log file exists and is writable
            touch storage/logs/laravel.log
            chmod 664 storage/logs/laravel.log
            
            # Set public directory permissions
            chmod -R 775 /home2/omnispac/public_html/shop/static 2>/dev/null || true
            
            echo "Permissions set successfully"
          SET_PERMS

      - name: Symlink verification
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
        run: |
          echo "Verifying symlinks and file structure..."
          ssh -p $SSH_PORT -i ~/.ssh/deploy_key ${SSH_USER}@${SSH_HOST} << 'VERIFY'
            set -e
            cd /home2/omnispac/solar-and-storage-core
            
            # Verify key files exist
            echo "=== Backend Structure ==="
            ls -la artisan
            ls -la config.php
            ls -la core/Branding.php
            ls -la core/Invoice.php
            ls -la core/Mailer.php
            ls -la vendor/autoload.php
            
            echo ""
            echo "=== Public Structure ==="
            ls -la /home2/omnispac/public_html/shop/index.php
            ls -la /home2/omnispac/public_html/shop/.htaccess
            ls -la /home2/omnispac/public_html/shop/static/css/tokens.css
            ls -la /home2/omnispac/public_html/shop/static/images/omnispace-logo.jpg
            ls -la /home2/omnispac/public_html/shop/static/images/omnispace-logo-white.png
            
            # Verify .env exists
            if [ -f .env ]; then
              echo ""
              echo "=== .env exists ==="
              # Show only non-sensitive config
              grep -E "^(APP_NAME|APP_ENV|APP_URL|DB_HOST|CACHE_STORE)" .env || true
            else
              echo ""
              echo "WARNING: .env file not found!"
            fi
            
            echo ""
            echo "Verification complete"
          VERIFY

      - name: Post-deploy cleanup
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
        run: |
          echo "Running post-deploy cleanup..."
          ssh -p $SSH_PORT -i ~/.ssh/deploy_key ${SSH_USER}@${SSH_HOST} << 'CLEANUP'
            set -e
            cd /home2/omnispac/solar-and-storage-core
            
            # Clear caches
            php artisan cache:clear 2>/dev/null || true
            php artisan config:clear 2>/dev/null || true
            php artisan view:clear 2>/dev/null || true
            
            # Optimize for production
            php artisan config:cache 2>/dev/null || true
            php artisan route:cache 2>/dev/null || true
            
            # Clean up old backups (keep last 5)
            ls -t .env.backup.* 2>/dev/null | tail -n +6 | xargs rm -f 2>/dev/null || true
            
            echo "Post-deploy cleanup complete"
          CLEANUP

      - name: Deployment confirmation
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
        run: |
          echo "=== Deployment Summary ==="
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Deployed at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo ""
          echo "=== File Counts ==="
          ssh -p $SSH_PORT -i ~/.ssh/deploy_key ${SSH_USER}@${SSH_HOST} << 'SUMMARY'
            echo "Backend files:"
            find /home2/omnispac/solar-and-storage-core -type f | wc -l
            
            echo "Public files:"
            find /home2/omnispac/public_html/shop -type f | wc -l
            
            echo "Static assets:"
            find /home2/omnispac/public_html/shop/static -type f | wc -l
          SUMMARY
          echo ""
          echo "Deployment completed successfully!"

      - name: Cleanup SSH
        if: ${{ always() }}
        run: rm -rf ~/.ssh/deploy_key
