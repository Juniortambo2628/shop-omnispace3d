name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Run Tests
    uses: ./.github/workflows/test.yml

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, json, bcmath, gd, dom
          coverage: none

      - name: Install dependencies (for composer autoloader)
        run: composer install --prefer-dist --no-progress --no-interaction --no-dev

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p $SSH_PORT $SSH_HOST >> ~/.ssh/known_hosts 2>/dev/null
          ssh -o ConnectTimeout=10 -o StrictHostKeyChecking=no -p $SSH_PORT -i ~/.ssh/deploy_key $SSH_USER@$SSH_HOST "echo SSH_OK" || {
            echo "SSH connection failed. Verify secrets are correct."
            exit 1
          }

      - name: Upload archives to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
        run: |
          echo "Creating archives..."
          tar czf /tmp/backend.tar.gz \
            --exclude='.git' --exclude='.env' --exclude='.env.*' \
            --exclude='vendor' --exclude='public' --exclude='artisan.bat' \
            --exclude='test*.php' --exclude='inspect_image.php' \
            --exclude='*.md' --exclude='*.docx' --exclude='*.bat' \
            --exclude='node_modules' --exclude='.github' --exclude='tests' \
            --exclude='phpunit.xml' --exclude='coverage' --exclude='.phpunit.cache' \
            --exclude='github-actions-omnispace*' .

          tar czf /tmp/public.tar.gz -C public .
          tar czf /tmp/static.tar.gz --exclude='images/products/*' static/

          echo "Uploading archives..."
          scp -P $SSH_PORT -i ~/.ssh/deploy_key /tmp/backend.tar.gz ${SSH_USER}@${SSH_HOST}:/tmp/backend.tar.gz
          scp -P $SSH_PORT -i ~/.ssh/deploy_key /tmp/public.tar.gz ${SSH_USER}@${SSH_HOST}:/tmp/public.tar.gz
          scp -P $SSH_PORT -i ~/.ssh/deploy_key /tmp/static.tar.gz ${SSH_USER}@${SSH_HOST}:/tmp/static.tar.gz
          echo "All archives uploaded."

      - name: Deploy and configure server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
        run: |
          ssh -o ConnectTimeout=30 -p $SSH_PORT -i ~/.ssh/deploy_key ${SSH_USER}@${SSH_HOST} << 'DEPLOY_ALL'
          set -e

          APP_DIR="/home2/omnispac/solar-and-storage-core"
          PUBLIC_DIR="/home2/omnispac/public_html/shop"

          # --- Backup .env ---
          if [ -f "${APP_DIR}/.env" ]; then
            cp "${APP_DIR}/.env" "${APP_DIR}/.env.backup.$(date +%Y%m%d%H%M%S)"
            echo "Backed up .env"
          fi

          # --- Extract backend ---
          mkdir -p "${APP_DIR}"
          cd "${APP_DIR}"
          tar xzf /tmp/backend.tar.gz
          rm -f /tmp/backend.tar.gz
          echo "Backend extracted"

          # --- Extract public ---
          mkdir -p "${PUBLIC_DIR}"
          cd "${PUBLIC_DIR}"
          tar xzf /tmp/public.tar.gz
          rm -f /tmp/public.tar.gz
          echo "Public files extracted"

          # --- Extract static ---
          mkdir -p "${PUBLIC_DIR}/static"
          cd "${PUBLIC_DIR}"
          tar xzf /tmp/static.tar.gz --overwrite
          rm -f /tmp/static.tar.gz
          echo "Static files extracted"

          # --- Find composer ---
          COMPOSER=""
          for cmd in composer composer.phar /usr/local/bin/composer /opt/cpanel/composer/bin/composer; do
            if command -v "$cmd" >/dev/null 2>&1 || [ -x "$cmd" ]; then
              COMPOSER="$cmd"
              break
            fi
          done
          # Try php -r fallback
          if [ -z "$COMPOSER" ]; then
            if [ -f "$HOME/.composer/composer.phar" ]; then
              COMPOSER="php $HOME/.composer/composer.phar"
            elif [ -f "$HOME/composer.phar" ]; then
              COMPOSER="php $HOME/composer.phar"
            fi
          fi
          
          if [ -z "$COMPOSER" ]; then
            echo "composer not found, downloading..."
            cd "${APP_DIR}"
            php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
            php composer-setup.php --quiet
            rm composer-setup.php
            COMPOSER="php composer.phar"
          fi
          
          echo "Using composer: $COMPOSER"

          # --- Install dependencies ---
          cd "${APP_DIR}"
          $COMPOSER install --no-dev --optimize-autoloader --no-interaction --no-progress
          echo "Composer dependencies installed"

          # --- Find PHP ---
          PHP_BIN=""
          for cmd in php php83 php8.3 /usr/bin/php /usr/local/bin/php; do
            if command -v "$cmd" >/dev/null 2>&1 || [ -x "$cmd" ]; then
              PHP_BIN="$cmd"
              break
            fi
          done
          PHP_BIN="${PHP_BIN:-php}"

          # --- Run migrations ---
          cd "${APP_DIR}"
          $PHP_BIN artisan migrate --force
          echo "Migrations complete"

          # --- Set permissions ---
          chmod -R 775 storage bootstrap/cache 2>/dev/null || true
          touch storage/logs/laravel.log
          chmod 664 storage/logs/laravel.log
          chmod -R 775 "${PUBLIC_DIR}/static" 2>/dev/null || true
          echo "Permissions set"

          # --- Verify structure ---
          echo ""
          echo "=== Verification ==="
          ls -la artisan
          ls -la config.php
          ls -la core/Branding.php
          ls -la vendor/autoload.php
          ls -la "${PUBLIC_DIR}/index.php"
          ls -la "${PUBLIC_DIR}/static/css/tokens.css"
          ls -la "${PUBLIC_DIR}/static/images/omnispace-logo.jpg"
          [ -f .env ] && echo ".env: OK" || echo "WARNING: .env missing"

          # --- Clear and rebuild caches ---
          cd "${APP_DIR}"
          $PHP_BIN artisan cache:clear 2>/dev/null || true
          $PHP_BIN artisan config:clear 2>/dev/null || true
          $PHP_BIN artisan view:clear 2>/dev/null || true
          $PHP_BIN artisan config:cache 2>/dev/null || true
          $PHP_BIN artisan route:cache 2>/dev/null || true

          # --- Cleanup old backups ---
          ls -t .env.backup.* 2>/dev/null | tail -n +6 | xargs rm -f 2>/dev/null || true

          echo ""
          echo "=== Deployment Complete ==="
          echo "Backend files: $(find ${APP_DIR} -type f | wc -l)"
          echo "Public files: $(find ${PUBLIC_DIR} -type f | wc -l)"
          DEPLOY_ALL

      - name: Deployment confirmation
        run: |
          echo "=== Deployment Summary ==="
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Deployed at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Deployment completed successfully!"

      - name: Cleanup SSH
        if: ${{ always() }}
        run: rm -rf ~/.ssh/deploy_key
